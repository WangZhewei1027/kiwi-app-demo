<!doctype html>\\n<html>\\n<head>\\n<meta charset=\\\"utf-8\\\">\\n<meta name=\\\"viewport\\\" content=\\\"width=device-width,initial-scale=1\\\">\\n<style>\\n  :root { --accent: #0a7aff; }\\n  html, body { background:#fff; color:#222; font: 16px/1.4 -apple-system, BlinkMacSystemFont, \\\"Segoe UI\\\", Roboto, Helvetica, Arial, sans-serif; }\\n  #app { max-width: 900px; margin: 16px auto; padding: 0 12px; }\\n  #controls { display:flex; gap:8px; flex-wrap: wrap; padding:10px; background:#f7f8fa; border:1px solid #e5e7eb; border-radius:10px; }\\n  button { appearance:none; border:1px solid #cfd5dc; background:#ffffff; color:#111; padding:8px 12px; border-radius:8px; cursor:pointer; font-weight:600; }\\n  button:hover { border-color:#a9b4bf; }\\n  button:disabled { color:#9aa3ad; background:#f2f4f7; border-color:#e5e7eb; cursor:not-allowed; }\\n  #viz { margin-top:12px; padding:14px; border:1px solid #e5e7eb; border-radius:12px; min-height:150px; }\\n  .legend { font-weight:600; margin-bottom:10px; }\\n  .legend .tgt { color: var(--accent); }\\n  .cells { display:flex; gap:8px; align-items:flex-end; flex-wrap: wrap; }\\n  .cell { width:52px; height:56px; border:2px solid #e5e7eb; border-radius:10px; display:flex; flex-direction:column; justify-content:center; align-items:center; background:#fff; transition:border-color 0.2s, background 0.2s; }\\n  .cell .num { font-size:14px; font-weight:700; }\\n  .cell .marks { font-size:12px; color:#6b7280; margin-top:4px; height:16px; line-height:16px; }\\n  .cell.out { background:#f3f4f6; color:#98a1ab; border-color:#edf0f3; }\\n  .cell.mid { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(10,122,255,0.12) inset; }\\n  .cell.found { background: var(--accent); color:#fff; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(10,122,255,0.25) inset; }\\n  #status { margin-top:12px; padding:10px 12px; background:#fbfbfd; border:1px solid #eef1f5; border-radius:10px; min-height:22px; }\\n</style>\\n</head>\\n<body>\\n<div id=\\\"app\\\">\\n  <div id=\\\"controls\\\">\\n    <button id=\\\"btnStep\\\">Step</button>\\n    <button id=\\\"btnRun\\\">Run</button>\\n    <button id=\\\"btnPickIn\\\">Pick target in array</button>\\n    <button id=\\\"btnPickOut\\\">Pick target not in array</button>\\n    <button id=\\\"btnReset\\\">Reset</button>\\n  </div>\\n  <div id=\\\"viz\\\"></div>\\n  <div id=\\\"status\\\"></div>\\n</div>\\n<script>\\n(function(){\\n  'use strict';\\n  var arr = [3,7,12,18,21,26,30,35,40,44,50,53,59,62,70];\\n  var initialTarget = 44; // seeded so the page is never empty\\n  var state, timerId = null;\\n\\n  function setStatus(s){ document.getElementById('status').innerText = s; }\\n\\n  function resetSearchPositions(){\\n    state.low = 0;\\n    state.high = arr.length - 1;\\n    state.mid = Math.floor((state.low + state.high) / 2);\\n    state.foundIndex = -1;\\n    state.finished = false;\\n    state.running = false;\\n  }\\n\\n  function init(){\\n    state = { target: initialTarget, low:0, high:arr.length-1, mid:0, foundIndex:-1, finished:false, running:false };\\n    state.mid = Math.floor((state.low + state.high) / 2);\\n    render();\\n    setStatus('Ready: target ' + state.target + ', the search interval is the whole array, and the middle is index ' + state.mid + '.');\\n  }\\n\\n  function startRun(){\\n    stopRun();\\n    state.running = true;\\n    timerId = setInterval(function(){\\n      if(state.finished){ stopRun(); return; }\\n      step();\\n    }, 650);\\n  }\\n\\n  function stopRun(){\\n    state.running = false;\\n    if(timerId){ clearInterval(timerId); timerId = null; }\\n  }\\n\\n  function render(){\\n    var viz = document.getElementById('viz');\\n    var htm = '';\\n    htm += '<div class=\\\"legend\\\">Target = <span class=\\\"tgt\\\">' + state.target + '</span></div>';\\n    htm += '<div class=\\\"cells\\\">';\\n    for(var i=0;i<arr.length;i++){\\n      var classes = 'cell';\\n      var inRange = (state.low <= state.high) && (i >= state.low && i <= state.high);\\n      var isFound = state.finished && state.foundIndex === i;\\n      if(!inRange && !isFound){ classes += ' out'; }\\n      var showMid = (state.low <= state.high) && (i === state.mid) && !state.finished;\\n      if(showMid){ classes += ' mid'; }\\n      if(isFound){ classes += ' found'; }\\n      var marks = [];\\n      if(state.low <= state.high && i === state.low){ marks.push('L'); }\\n      if(state.low <= state.high && i === state.mid && !state.finished){ marks.push('M'); }\\n      if(state.low <= state.high && i === state.high){ marks.push('H'); }\\n      if(isFound){ marks = ['\\\\u2713']; }\\n      htm += '<div class=\\\"' + classes + '\\\"><div class=\\\"num\\\">' + arr[i] + '</div><div class=\\\"marks\\\">' + marks.join(' ') + '</div></div>';\\n    }\\n    htm += '</div>';\\n    viz.innerHTML = htm;\\n    document.getElementById('btnStep').disabled = state.finished;\\n    document.getElementById('btnRun').disabled = state.finished;\\n  }\\n\\n  function step(){\\n    if(state.finished){ return; }\\n    // Ensure any auto-run that finishes will stop itself\\n    var lo = state.low, hi = state.high;\\n    if(lo > hi){\\n      state.finished = true;\\n      render();\\n      setStatus('Search interval is empty, so the target ' + state.target + ' is not in the array.');\\n      stopRun();\\n      return;\\n    }\\n    var mid = Math.floor((lo + hi) / 2);\\n    var midVal = arr[mid];\\n\\n    if(midVal === state.target){\\n      state.mid = mid;\\n      state.foundIndex = mid;\\n      state.finished = true;\\n      render();\\n      setStatus('Target equals the middle value ' + midVal + ', so we found it at index ' + mid + '.');\\n      stopRun();\\n      return;\\n    }\\n\\n    if(state.target < midVal){\\n      state.high = mid - 1;\\n      if(state.low > state.high){\\n        state.finished = true;\\n        render();\\n        setStatus('Target ' + state.target + ' is less than middle ' + midVal + ', and now the interval is empty, so it is not in the array.');\\n        stopRun();\\n        return;\\n      }\\n      state.mid = Math.floor((state.low + state.high) / 2);\\n      render();\\n      setStatus('Target ' + state.target + ' is less than middle ' + midVal + ', so we keep the left half and drop the right.');\\n      return;\\n    } else {\\n      state.low = mid + 1;\\n      if(state.low > state.high){\\n        state.finished = true;\\n        render();\\n        setStatus('Target ' + state.target + ' is greater than middle ' + midVal + ', and now the interval is empty, so it is not in the array.');\\n        stopRun();\\n        return;\\n      }\\n      state.mid = Math.floor((state.low + state.high) / 2);\\n      render();\\n      setStatus('Target ' + state.target + ' is greater than middle ' + midVal + ', so we keep the right half and drop the left.');\\n      return;\\n    }\\n  }\\n\\n  function pickTargetInArray(){\\n    stopRun();\\n    var idx = Math.floor(Math.random() * arr.length);\\n    state.target = arr[idx];\\n    resetSearchPositions();\\n    render();\\n    setStatus('Chose ' + state.target + ' as the new target so we can watch the search find it.');\\n  }\\n\\n  function pickTargetNotInArray(){\\n    stopRun();\\n    var min = 1, max = 72, x;\\n    var present = {};\\n    for(var i=0;i<arr.length;i++){ present[arr[i]] = true; }\\n    do { x = Math.floor(Math.random()*(max - min + 1)) + min; } while(present[x]);\\n    state.target = x;\\n    resetSearchPositions();\\n    render();\\n    setStatus('Chose ' + state.target + ' which is not in the array to show how binary search concludes not found.');\\n  }\\n\\n  function onRunClick(){\\n    if(state.finished){ return; }\\n    // Always make a visible change on click\\n    step();\\n    if(!state.finished){\\n      if(state.running){ stopRun(); setStatus('Paused auto-run so you can step manually.'); }\\n      else { startRun(); }\\n    }\\n  }\\n\\n  function onStepClick(){\\n    stopRun();\\n    step();\\n  }\\n\\n  function onReset(){\\n    stopRun();\\n    state.target = initialTarget;\\n    resetSearchPositions();\\n    render();\\n    setStatus('Reset to the start: target ' + state.target + ' and the search interval is the whole array.');\\n  }\\n\\n  // Wire up controls\\n  document.getElementById('btnStep').addEventListener('click', onStepClick);\\n  document.getElementById('btnRun').addEventListener('click', onRunClick);\\n  document.getElementById('btnPickIn').addEventListener('click', pickTargetInArray);\\n  document.getElementById('btnPickOut').addEventListener('click', pickTargetNotInArray);\\n  document.getElementById('btnReset').addEventListener('click', onReset);\\n\\n  // Go\\n  init();\\n})();\\n</script>\\n</body>\\n</html>
