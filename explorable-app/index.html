          '    return "Compared " + x + " and " + y + ": already in order, so nothing moves.";',
          '  },',
          '  shuffle: function(s){',
          '    s.a = s.a.map(function(){ return 1 + Math.floor(Math.random() * 9); });',
          '    s.i = 0; s.j = 0; s.done = false;',
          '    return "New array. Press Step to start comparing again.";',
          '  }',
          '}',
        ].join('\n'),
        render: [
          'function(s, el){',
          '  el.innerHTML = \'<div class="bars">\' + s.a.map(function(v, k){',
          '    var cls = (!s.done && (k === s.j || k === s.j + 1)) ? " hi" : (k >= s.a.length - s.i ? " dim" : "");',
          '    return \'<div class="bar\' + cls + \'" style="height:\' + (v * 17 + 20) + \'px">\' + v + \'</div>\';',
          '  }).join("") + \'</div>\';',
          '}',
        ].join('\n'),
        steps: [
          'Step once and read the sentence under the bars — it says what the comparison decided.',
          'Hold Run and watch the grey tail on the right grow by one bar per pass.',
          'Shuffle, then predict how many passes it will need before pressing Run.',
        ],
      };

      DEMOS.stack = {
        title: 'Stack',
        subtitle: 'Last in, first out — the newest value is the only one you can reach.',
        intro: 'Push a value and watch where it lands.',
        controls: [
          { id: 'val', kind: 'number', label: 'value', value: 7 },
          { id: 'push', kind: 'button', label: 'Push', primary: true },
          { id: 'pop', kind: 'button', label: 'Pop' },
          { id: 'peek', kind: 'button', label: 'Peek' },
        ],
        stateInit: '{ items: [3, 8], look: -1 }',
        actions: [
          '{',
          '  push: function(s, inputs){',
          '    var v = inputs.val;',
          '    if (!isFinite(v)) return "That is not a number, so nothing was pushed.";',
          '    s.items.push(v); s.look = -1;',
          '    return "Pushed " + v + " onto the top. It is now the only value you can reach without removing something.";',
          '  },',
          '  pop: function(s){',
          '    s.look = -1;',
          '    if (!s.items.length) return "Underflow: there is nothing to pop. A real implementation raises an error here.";',
          '    var v = s.items.pop();',
          '    return "Popped " + v + " — the newest value, not the oldest. " + s.items.length + " left.";',
          '  },',
          '  peek: function(s){',
          '    if (!s.items.length) return "Nothing to peek at.";',
          '    s.look = s.items.length - 1;',
          '    return "Peek reads " + s.items[s.look] + " from the top without removing it — the size is still " + s.items.length + ".";',
          '  }',
          '}',
        ].join('\n'),
        render: [
          'function(s, el){',
          '  if (!s.items.length) { el.innerHTML = \'<div class="cells col"><div class="cell dim">empty</div></div>\'; return; }',
          '  el.innerHTML = \'<div class="cells col">\' + s.items.map(function(v, k){',
          '    var top = k === s.items.length - 1;',
          '    return \'<div class="cell\' + (k === s.look ? " hi" : (top ? " on" : "")) + \'">\' + v + \'</div>\';',
          '  }).join("") + \'</div>\';',
          '}',
        ].join('\n'),
        steps: [
          'Push three values, then pop once — note which one comes back.',
          'Peek and check the size afterwards: reading is not removing.',
          'Pop an empty stack to see the underflow case.',
        ],
      };

      DEMOS.queue = {
        title: 'Queue',
        subtitle: 'First in, first out — the value that has waited longest is the one that leaves.',
        intro: 'Enqueue a value and watch it join the back of the line.',
        controls: [
          { id: 'val', kind: 'number', label: 'value', value: 7 },
          { id: 'enqueue', kind: 'button', label: 'Enqueue', primary: true },
          { id: 'dequeue', kind: 'button', label: 'Dequeue' },
          { id: 'peek', kind: 'button', label: 'Peek' },
        ],
        stateInit: '{ items: [3, 8], look: -1 }',
        actions: [
          '{',
          '  enqueue: function(s, inputs){',
          '    var v = inputs.val;',
          '    if (!isFinite(v)) return "That is not a number, so nothing joined the queue.";',
          '    s.items.push(v); s.look = -1;',
          '    return "Enqueued " + v + " at the back. " + (s.items.length - 1) + " value(s) are ahead of it.";',
          '  },',
          '  dequeue: function(s){',
          '    s.look = -1;',
          '    if (!s.items.length) return "The queue is empty — there is nothing waiting to be served.";',
          '    var v = s.items.shift();',
          '    return "Dequeued " + v + " from the front — the value that had waited longest, not the newest.";',
          '  },',
          '  peek: function(s){',
          '    if (!s.items.length) return "Nothing to peek at.";',
          '    s.look = 0;',
          '    return "Peek reads " + s.items[0] + " from the front without serving it — the length is still " + s.items.length + ".";',
          '  }',
          '}',
        ].join('\n'),
        render: [
          'function(s, el){',
          '  if (!s.items.length) { el.innerHTML = \'<div class="cells"><div class="cell dim">empty</div></div>\'; return; }',
          '  el.innerHTML = \'<div class="col"><div class="cells">\' + s.items.map(function(v, k){',
          '    return \'<div class="cell\' + (k === s.look ? " hi" : (k === 0 ? " on" : "")) + \'">\' + v + \'</div>\';',
          '  }).join("") + \'</div><div class="row"><span class="label">front — served next</span></div></div>\';',
          '}',
        ].join('\n'),
        steps: [
          'Enqueue twice, then dequeue once — check which value came back.',
          'Compare with a stack: same two operations, opposite end.',
          'Peek reads the front without removing it.',
        ],
      };

      DEMOS.search = {
        title: 'Binary Search',
        subtitle: 'The list is sorted, so one comparison can rule out half of what is left.',
        intro: 'Pick a target and press Step.',
        controls: [
          { id: 'target', kind: 'number', label: 'target', value: 23 },
          { id: 'step', kind: 'button', label: 'Step', primary: true },
          { id: 'run', kind: 'play', label: 'Run', target: 'step' },
        ],
        stateInit: '{ a: [2,5,8,12,16,23,38,56,72,91], lo: 0, hi: 9, mid: -1, found: -1, over: false }',
        actions: [
          '{',
          '  step: function(s, inputs){',
          '    if (s.over) return { status: "Finished — press Reset to search again.", done: true };',
          '    var t = inputs.target;',
          '    if (s.lo > s.hi) { s.over = true; s.mid = -1; return { status: t + " is not in the list, and it took only a handful of comparisons to rule out all ten values.", done: true }; }',
          '    s.mid = Math.floor((s.lo + s.hi) / 2);',
          '    var v = s.a[s.mid];',
          '    if (v === t) { s.found = s.mid; s.over = true; return { status: "Found " + t + " at index " + s.mid + ".", done: true }; }',
          '    if (v < t) { s.lo = s.mid + 1; return "a[" + s.mid + "] = " + v + " is smaller than " + t + ", so everything from there leftwards is ruled out."; }',
          '    s.hi = s.mid - 1;',
          '    return "a[" + s.mid + "] = " + v + " is larger than " + t + ", so everything from there rightwards is ruled out.";',
          '  }',
          '}',
        ].join('\n'),
        render: [
          'function(s, el){',
          '  el.innerHTML = \'<div class="cells">\' + s.a.map(function(v, k){',
          '    var cls = k === s.found ? " on" : (k === s.mid ? " hi" : ((k < s.lo || k > s.hi) ? " dim" : ""));',
          '    return \'<div class="cell\' + cls + \'">\' + v + \'</div>\';',
          '  }).join("") + \'</div>\';',
          '}',
        ].join('\n'),
        steps: [
          'Step once and count how many values went grey.',
          'Change the target to something absent, like 40, and Run it.',
          'Ten values need at most four probes — that is the log₂ in the complexity.',
        ],
      };

      function genericDemo(concept) {
        const c = String(concept);
        return {
          title: c,
          subtitle: 'Walk the process one stage at a time and watch what changes.',
          intro: 'Press Step to advance one stage.',
          controls: [
            { id: 'step', kind: 'button', label: 'Step', primary: true },
            { id: 'run', kind: 'play', label: 'Run', target: 'step' },
          ],
          stateInit: '{ stage: 0, names: ["Input", "Work", "Result"], seen: [] }',
          actions: [
            '{',
            '  step: function(s){',
            '    if (s.stage >= s.names.length - 1) return { status: "That is the last stage — press Reset to walk it again.", done: true };',
            '    s.stage++;',
            '    s.seen.push(s.names[s.stage]);',
            '    return "Now at stage " + (s.stage + 1) + " of " + s.names.length + ": " + s.names[s.stage] + ".";',
            '  }',
            '}',
          ].join('\n'),
          render: [
            'function(s, el){',
            '  el.innerHTML = \'<div class="nodes">\' + s.names.map(function(n, k){',
            '    return \'<div class="node\' + (k === s.stage ? " hi" : (k > s.stage ? " dim" : "")) + \'">\' + (k + 1) + \'</div>\';',
            '  }).join(\'<span class="label">→</span>\') + \'</div>\';',
            '}',
          ].join('\n'),
          steps: [
            'This one is a built-in sample: in demo mode there is no model to design a visual for "' + c + '".',
            'Open the app inside a Kiwi class, or try Bubble Sort, Stack or Binary Search offline.',
          ],
        };
      }

      function pickDemo(concept) {
        const c = String(concept || '').toLowerCase();
        if (/sort/.test(c)) return DEMOS.sort;
        if (/queue/.test(c)) return DEMOS.queue;
        if (/stack|deque/.test(c)) return DEMOS.stack;
        if (/search/.test(c) && !/tree|graph|depth|breadth/.test(c)) return DEMOS.search;
        return genericDemo(concept);
      }

      function conceptOf(prompt) {
        const m = String(prompt || '').match(/Concept:\s*"([^"]+)"/);
        return m ? m[1] : 'this concept';
      }

      /* The demo's prose, in the two prose calls' shapes. */
      function demoHead(d) {
        return { title: d.title, concept: d.subtitle };
      }

      function demoHowto(d) {
        return { howto: (d.steps || []).slice(0, 2).join(' ') };
      }

      function demoControls(d) {
        return (d.controls || []).map((c) => c.label || c.id);
      }

      /* What the CAPPED route realistically returns: a minimal page. Also what
         keeps the offline demo usable — the Simulator streams askAI replies at
         ~28 words/second, so the full demo page would take close to a minute.
         Split closing tag: a literal one would end the outer script block. */
      function demoMiniPage(d) {
        const SE = '<' + '/script' + '>';
        const steps = JSON.stringify((d.steps || ['Press Step to advance.']).concat(['Done - press Reset to run it again.']));
        return [
          '<!doctype html><html><head><meta charset="utf-8"><style>',
          'body{font:14px/1.5 -apple-system,system-ui,sans-serif;margin:0;padding:18px;color:#1b2230}',
          '.c{display:flex;gap:8px;margin-bottom:12px}',
          'button{font:inherit;padding:7px 14px;border:1px solid #d8dee8;border-radius:8px;background:#f3f5f8;cursor:pointer}',
          'button.p{background:#1f9d76;border-color:#1f9d76;color:#fff}',
          '.dots{display:flex;gap:8px;margin:14px 0}',
          '.d{width:34px;height:34px;border-radius:50%;border:2px solid #d8dee8;display:flex;align-items:center;justify-content:center;font-weight:700;color:#8a94a3}',
          '.d.on{border-color:#1f9d76;background:#e9f7f1;color:#178060}',
          '.s{border:1px solid #e4e8ef;border-radius:8px;padding:10px 12px;background:#fbfcfe;min-height:40px}',
          '</style></head><body>',
          '<div class="c"><button class="p" id="step">Step</button><button id="reset">Reset</button></div>',
          '<div class="dots" id="dots"></div><div class="s" id="st"></div>',
          '<' + 'script>',
          'var STEPS=' + steps + ',i=-1;',
          'var dots=document.getElementById("dots"),st=document.getElementById("st");',
          'function draw(){dots.innerHTML=STEPS.map(function(_,k){return \'<div class="d\'+(k<=i?" on":"")+\'">\'+(k+1)+"</div>"}).join("");',
          'st.textContent=i<0?"Press Step.":STEPS[i];}',
          'document.getElementById("step").onclick=function(){if(i<STEPS.length-1)i++;draw();};',
          'document.getElementById("reset").onclick=function(){i=-1;draw();};draw();',
          SE, '</body></html>',
        ].join('\n');
      }

      /* The demo's interactive parts, in the (lean) build call's shape. */
      function demoSlots(d) {
        return {
          intro: d.intro,
          controls: d.controls,
          stateInit: d.stateInit,
          actions: d.actions,
          render: d.render,
        };
      }

      /* --- the uncapped surface: only the page ever arrives here ----------- */
      function simulatedContextualChat(params) {
        const msg = (params && params.userMessage) || '';
        const d = pickDemo(conceptOf(msg));
        const body = { html: assemble(demoSlots(d)), controls: demoControls(d), summary: d.subtitle };
        return {
          output: JSON.stringify(body),
          promptId: PROMPT_ID,
          promptName: 'Explorable Explanation Builder',
          contextIncluded: ['weak_concepts', 'relevant_materials'],
          contextOmitted: [],
        };
      }

      /* --- the capped surface: which of the three calls is this? ----------- */
      function simulatedAI(prompt) {
        const p = String(prompt || '');
        const d = pickDemo(conceptOf(p));

        if (/Write the two text parts/.test(p)) return JSON.stringify(demoHead(d));
        if (/Write the how-to line/.test(p)) return JSON.stringify(demoHowto(d));
        if (/as a complete web page/.test(p)) return demoMiniPage(d);
        return 'The Simulator has no fixture for that request.';
      }

    </script>
  </body>
</html>
